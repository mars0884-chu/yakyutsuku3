name: Build and publish Yakyutsuku3
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '25 18 * * 0'

permissions:
  contents: write


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check scripts/refresh-data.mjs
          node --check scripts/vendor-cover.mjs
          node --check scripts/vendor-ocr.mjs
          node --check scripts/vendor-paddleocr.mjs
      - name: Build complete 3,767-player roster
        run: npm run refresh
      - name: Vendor game cover thumbnail
        run: npm run vendor:cover
      - name: Vendor OCR locally for iPhone/desktop
        run: npm run vendor:ocr
      - name: Vendor PaddleOCR locally for new rosters
        run: npm run vendor:paddle
      - name: Assemble static site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html styles.css app.js manifest.webmanifest sw.js VERSION _site/
          cp -R assets data vendor _site/
          touch _site/.nojekyll
      - name: Publish complete site to gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cd _site
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Publish Yakyutsuku3 from ${SOURCE_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git push --force origin gh-pages
