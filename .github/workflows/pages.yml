name: Build and deploy Yakyutsuku3
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '25 18 * * 0'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build complete 3,767-player roster
        run: npm run refresh
      - name: Vendor game cover thumbnail
        run: npm run vendor:cover
      - name: Vendor OCR locally for iPhone/desktop
        run: npm run vendor:ocr
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js manifest.webmanifest sw.js _site/
          cp -R assets data vendor _site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4