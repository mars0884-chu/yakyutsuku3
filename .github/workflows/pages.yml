name: Build and publish Yakyutsuku3
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '25 18 * * 0'

permissions:
  contents: write

concurrency:
  group: yakyutsuku3-pages
  cancel-in-progress: true


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check scripts/refresh-data.mjs
          node --check scripts/vendor-cover.mjs
          node --check scripts/vendor-ocr.mjs
          node --check scripts/vendor-paddleocr.mjs
          node --check scripts/smoke-recognition.mjs
          for file in engine/*.js; do node --check "$file"; done
          node -e "const f=require('fs'); const p=JSON.parse(f.readFileSync('engine/claude-glyphs.json','utf8')); if([...p.chars].length!==1029||!p.data?.length)process.exit(1);"
      - name: Verify desktop/mobile recognition coexistence
        run: node scripts/smoke-recognition.mjs
      - name: Verify pixel-mask overlap invariants
        run: node scripts/smoke-overlap-r21.mjs
      - name: Check active r18 CV and Safari update
        run: node scripts/smoke-r18.mjs
      - name: Verify r22 matching and deduplicated guide data
        run: node scripts/smoke-r22.mjs
      - name: Verify semantic guide consolidation
        run: node scripts/smoke-guides-r23.mjs
      - name: Verify r24 recognition consensus and source consolidation
        run: node scripts/smoke-r24.mjs
      - name: Check strict r26 original-crop candidate recovery
        run: node scripts/smoke-r26.mjs
      - name: Build complete 3,767-player roster
        run: npm run refresh
      - name: Vendor game cover thumbnail
        run: npm run vendor:cover
      - name: Assemble Safari / Chrome / Edge static site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html styles.css app.js manifest.webmanifest sw.js VERSION _site/
          cp -R assets data engine _site/
          touch _site/.nojekyll
      - name: Publish complete site to gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cd _site
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Publish Yakyutsuku3 from ${SOURCE_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git push --force origin gh-pages
