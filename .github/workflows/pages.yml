name: Build and publish Yakyutsuku3
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '25 18 * * 0'

permissions:
  contents: write

concurrency:
  group: yakyutsuku3-pages
  cancel-in-progress: true


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check scripts/refresh-data.mjs
          node --check scripts/vendor-cover.mjs
          node --check scripts/vendor-ocr.mjs
          node --check scripts/vendor-paddleocr.mjs
          node --check scripts/smoke-recognition.mjs
          for file in engine/*.js; do node --check "$file"; done
          node -e "const f=require('fs'); const p=JSON.parse(f.readFileSync('engine/claude-glyphs.json','utf8')); if([...p.chars].length!==1029||!p.data?.length)process.exit(1);"
      - name: Verify desktop/mobile recognition coexistence
        run: node scripts/smoke-recognition.mjs
      - name: Verify pixel-mask overlap invariants
        run: node scripts/smoke-overlap-r21.mjs
      - name: Check active r18 CV and Safari update
        run: node scripts/smoke-r18.mjs
      - name: Verify r22 matching and deduplicated guide data
        run: node scripts/smoke-r22.mjs
      - name: Verify semantic guide consolidation
        run: node scripts/smoke-guides-r23.mjs
      - name: Verify r24 recognition consensus and source consolidation
        run: node scripts/smoke-r24.mjs
      - name: Check strict r26 original-crop candidate recovery
        run: node scripts/smoke-r26.mjs
      - name: Verify r27 semantic deduplication
        run: node scripts/smoke-r27.mjs
      - name: Test r28 separator-free CV and guide dedup
        run: node scripts/smoke-r28.mjs
      - name: Verify r29 selected navy rows and tentative display
        run: node scripts/smoke-r29.mjs
      - name: Verify r30 blank row suppression and ZIP import
        run: node scripts/smoke-r30.mjs
      - name: Verify r31 ZIP-group overlap and player comparison
        run: node scripts/smoke-r31.mjs
      - name: Verify r32 inset screenshot handling and source uniqueness
        run: node scripts/smoke-r32.mjs
      - name: Verify r33 Bahamut skill codes and no duplicate guide rows
        run: node scripts/smoke-r33.mjs
      - name: Verify r34 guide semantic dedup and source index
        run: node scripts/smoke-r34.mjs
      - name: Verify r35 external research, Japanese/Traditional Chinese and historic codes
        run: node scripts/smoke-r35.mjs
      - name: Verify r36 Bahamut PCSX2 codes, access status and exact dedup
        run: node scripts/smoke-r36.mjs
      - name: Verify r37 cited historical guides and alternate facility strategy
        run: node scripts/smoke-r37.mjs
      - name: Verify r38 2006 Bahamut original PAR code and documented PS2 cases
        run: node scripts/smoke-r38.mjs
      - name: Verify r39 three-run pitchers, Camp menu and PS2-only source separation
        run: node scripts/smoke-r39.mjs
      - name: Verify r40 recovered Japanese PS2 guides, bilingual data and uncertain ROM analysis
        run: node scripts/smoke-r40.mjs
      - name: Verify r41 original 68 Memo values, HDD code templates and source contradictions
        run: node scripts/smoke-r41.mjs
      - name: Verify r42 original source pitch counts and corrected 2012 values
        run: node scripts/smoke-r42.mjs
      - name: Verify r43 2011 PS2 year-mode archive and injury-facility corrections
        run: node scripts/smoke-r43.mjs
      - name: Verify r44 historical 52-year archives and 2005 PS2 FAQs
        run: node scripts/smoke-r44.mjs
      - name: Build complete 3,767-player roster
        run: npm run refresh
      - name: Vendor game cover thumbnail
        run: npm run vendor:cover
      - name: Assemble Safari / Chrome / Edge static site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html styles.css app.js manifest.webmanifest sw.js VERSION _site/
          cp -R assets data engine _site/
          mkdir -p _site/vendor
          cp node_modules/jszip/dist/jszip.min.js _site/vendor/jszip.min.js
          touch _site/.nojekyll
      - name: Publish complete site to gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cd _site
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Publish Yakyutsuku3 from ${SOURCE_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git push --force origin gh-pages
